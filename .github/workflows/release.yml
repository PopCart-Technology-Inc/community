# Publishes a GitHub Release when a maintainer pushes a version tag (vMAJOR.MINOR.PATCH).
# Only maintainers can create v* tags (tag ruleset), tags can never be moved or deleted, and the
# tagged commit must already be on main, written up in CHANGELOG.md, and leak-clean.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Leakcheck, whole history
        env:
          LEAKCHECK_PRIVATE: ${{ secrets.LEAKCHECK_PRIVATE }}
        run: python3 tools/leakcheck/leakcheck.py --history
      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: python3 tools/ci/changelog.py notes "$TAG" > "$RUNNER_TEMP/notes.md"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          pre=; case "$TAG" in v0.*|*-*) pre=--prerelease;; esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" $pre
