# PUBLIC REPO: every push and pull request is checked for secrets, personal data and internal names,
# across the whole history (a secret deleted in a later commit is still public).
name: leakcheck
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  leakcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Leakcheck tests
        run: python3 -m unittest discover -s tools/leakcheck
      - name: Leakcheck, whole history
        env:
          LEAKCHECK_PRIVATE: ${{ secrets.LEAKCHECK_PRIVATE }}
        run: python3 tools/leakcheck/leakcheck.py --history
      - name: Gitleaks, whole history (second opinion)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -eu
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$base/$tarball"
          curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $tarball\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          ./gitleaks git --redact --no-banner --exit-code 1 .
